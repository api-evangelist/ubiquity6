aid: ubiquity6
name: Ubiquity6
description: >-
  Ubiquity6 was a San Francisco augmented-reality startup ("Capture & Edit
  Reality") backed by Benchmark, First Round, and Index Ventures. It built
  Display.land, a multiplayer 3D/AR/VR capture and creation platform, acquired
  Wavy AR, and was acquired by Discord in June 2021, after which its products
  were discontinued. Ubiquity6 never published a public API or developer
  program; its GitHub organization survives as a set of open-source computer
  vision and React Native forks, and a few internal packages remain on npm
  under the @ubiquity6 scope.
